<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanierung & Erweiterung Gründerzentrale</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/e23613ff3b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <div class="topnav">
            <div class="topnav-buttons">
                <a class="hover-3" href="../index.html#Info">Über mich</a>
                <a class="hover-3" href="../index.html#projects">Projekte</a>
                <a class="hover-3" href="../index.html#contact">Kontakt</a>
                <a class="hover-3 close-link" href="../index.html#projects" aria-label="Zurück zu Projekten"><i class="fa-solid fa-circle-xmark"></i></a>
            </div>
        </div>
    </div>

    <div class="headingDIV">
        <h2 class="heading">Sanierung &amp; Erweiterung Gründerzentrale<span style="color: rgb(255, 94, 0); font-size: 60px">.</span></h2>
    </div>

    <main class="project-layout">
        <section class="info-card viewer-shell" style="flex: 1 1 100%; max-width: 1100px;">
            <div class="viewer-frame">
                <button class="viewer-nav" id="sanierungPrev" aria-label="Vorherige Seite">❮</button>
                <img id="sanierungViewerImage" src="pdf_pages/sanierung_seite_4_p1.png" alt="Sanierung & Erweiterung Gründerzentrale">
                <button class="viewer-nav" id="sanierungNext" aria-label="Nächste Seite">❯</button>
            </div>
        </section>
    </main>

    <script>
        const sanierungPages = [
            'pdf_pages/sanierung_seite_4_p1.png',
            'pdf_pages/sanierung_seite_5_p1.png',
            'pdf_pages/sanierung_seite_6_p1.png',
            'pdf_pages/sanierung_seite_7_p1.png'
        ];

        let sanierungIndex = 0;
        const sanierungImage = document.getElementById('sanierungViewerImage');

        function renderSanierungPage(index) {
            sanierungImage.src = sanierungPages[index];
        }

        document.getElementById('sanierungPrev').addEventListener('click', () => {
            sanierungIndex = (sanierungIndex - 1 + sanierungPages.length) % sanierungPages.length;
            renderSanierungPage(sanierungIndex);
        });

        document.getElementById('sanierungNext').addEventListener('click', () => {
            sanierungIndex = (sanierungIndex + 1) % sanierungPages.length;
            renderSanierungPage(sanierungIndex);
        });
    </script>
</body>
</html>
