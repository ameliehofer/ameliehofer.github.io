<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entwurf eines Parkhauses mit Solardach</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/e23613ff3b.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <div class="topnav">
            <div class="topnav-buttons">
                <a class="hover-3" href="../index.html#Info">Über mich</a>
                <a class="hover-3" href="../index.html#projects">Projekte</a>
                <a class="hover-3" href="../index.html#contact">Kontakt</a>
                <a class="hover-3 close-link" href="../index.html#projects" aria-label="Zurück zu Projekten"><i class="fa-solid fa-circle-xmark"></i></a>
            </div>
        </div>
    </div>

    <div class="headingDIV">
        <h2 class="heading">Entwurf eines Parkhauses mit Solardach<span style="color: rgb(255, 94, 0); font-size: 60px">.</span></h2>
    </div>

    <main class="project-layout">
        <section class="info-card viewer-shell" style="flex: 1 1 100%; max-width: 1100px;">
            <div class="viewer-frame">
                <button class="viewer-nav" id="solarmodulePrev" aria-label="Vorherige Seite">❮</button>
                <img id="solarmoduleViewerImage" src="pdf_pages/solarmodule_seite_13_p1.png" alt="Entwurf eines Parkhauses mit Solardach">
                <button class="viewer-nav" id="solarmoduleNext" aria-label="Nächste Seite">❯</button>
            </div>
        </section>
    </main>

    <script>
        const solarmodulePages = [
            'pdf_pages/solarmodule_seite_13_p1.png',
            'pdf_pages/solarmodule_seite_14_p1.png'
        ];

        let solarmoduleIndex = 0;
        const solarmoduleImage = document.getElementById('solarmoduleViewerImage');

        function renderSolarmodulePage(index) {
            solarmoduleImage.src = solarmodulePages[index];
        }

        document.getElementById('solarmodulePrev').addEventListener('click', () => {
            solarmoduleIndex = (solarmoduleIndex - 1 + solarmodulePages.length) % solarmodulePages.length;
            renderSolarmodulePage(solarmoduleIndex);
        });

        document.getElementById('solarmoduleNext').addEventListener('click', () => {
            solarmoduleIndex = (solarmoduleIndex + 1) % solarmodulePages.length;
            renderSolarmodulePage(solarmoduleIndex);
        });
    </script>
</body>
</html>
